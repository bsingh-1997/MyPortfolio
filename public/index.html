

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Portfolio of Barinder Singh - Full Stack Developer & AWS Architect"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0a;
        color: #ffffff;
        overflow-x: hidden;
        margin: 0;
      }
      h1, h2, h3, .font-space {
        font-family: 'Space Grotesk', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f5ff;
      }
      .text-glow {
        text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
      }
      .bg-glass {
        background: rgba(10, 10, 10, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .highlight-word {
        position: relative;
        display: inline-block;
        background-clip: text;
        -webkit-background-clip: text;
      }
      
      /* Hide root initially to avoid FOUC */
      #root {
        opacity: 0;
        transition: opacity 0.5s ease-in;
      }
      #root.loaded {
        opacity: 1;
      }
    </style>
    
    <title>Barinder Singh | Full Stack Developer & AWS Architect</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <script>
      // Remove the loading class when React mounts
      document.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        root.classList.add('loaded');
      });
    </script>
  </body>
</html>
